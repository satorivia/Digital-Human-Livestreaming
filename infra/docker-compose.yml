services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digital_human
      POSTGRES_USER: digital_human
      POSTGRES_PASSWORD: digital_human_dev
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U digital_human"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
  srs:
    image: ossrs/srs:5
    ports: ["1935:1935", "1985:1985", "8080:8080"]
